name: Phase 1 reader checks
on: pull_request
permissions:
  contents: read
jobs:
  reader:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            project: phone
            channel: chromium
          - os: windows-latest
            project: desktop
            channel: msedge
          - os: windows-latest
            project: desktop
            channel: chrome
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      READER_BROWSER_CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Upgrade tests build the released Phase 1 and Milestone 3 readers.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - if: runner.os != 'Windows'
        run: npm run test:unit
      # Keep file-backed SQLite and service-restart suites from competing for
      # the same Windows runner. Each test still has its original time limit.
      - name: Run Windows unit and integration tests
        if: runner.os == 'Windows'
        run: npm run test:unit -- --no-file-parallelism
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=${{ matrix.project }} --workers=1
      - name: Test the Milestone 3 browser upgrade in Windows Brave
        if: matrix.channel == 'chrome'
        shell: pwsh
        run: |
          choco install brave --yes --no-progress
          $bravePath = 'BraveSoftware\Brave-Browser\Application\brave.exe'
          $env:READER_BROWSER_EXECUTABLE = Join-Path $env:LOCALAPPDATA $bravePath
          if (!(Test-Path -LiteralPath $env:READER_BROWSER_EXECUTABLE)) {
            $env:READER_BROWSER_EXECUTABLE = Join-Path $env:ProgramFiles $bravePath
          }
          (Get-Item -LiteralPath $env:READER_BROWSER_EXECUTABLE -ErrorAction Stop).VersionInfo.ProductVersion
          npx.cmd playwright test --project=desktop --workers=1 --grep "Milestone 3 subscription checkpoint"
      - name: Sample three live publishers with the local service
        if: matrix.channel == 'chrome' && contains(github.event.pull_request.body, '[public-feed-smoke]')
        continue-on-error: true # The deterministic publisher tests above are required on every PR.
        run: npm run test:feeds:live
      - name: Verify the live licensed article in the Windows reader
        if: matrix.channel == 'chrome' && contains(github.event.pull_request.body, '[public-feed-smoke]')
        run: node tests/owner/windows.ts
      - if: matrix.channel == 'chrome' && contains(github.event.pull_request.body, '[public-feed-smoke]')
        uses: actions/upload-artifact@v4
        with:
          name: windows-owner-preview
          path: playwright-report/owner-preview
      - if: matrix.channel == 'chrome'
        uses: actions/upload-artifact@v4
        with:
          name: reading-box-preview
          path: dist
          include-hidden-files: true
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Allow the runner to use its emulator accelerator
        run: sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Start the production demo
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/reading-preview.log 2>&1 &
          curl --retry 15 --retry-delay 1 --retry-connrefused --fail http://127.0.0.1:4173/
      - name: Test Chrome on Android
        uses: reactivecircus/android-emulator-runner@v2
        env:
          READING_BOX_LIVE_REVIEW: ${{ contains(github.event.pull_request.body, '[public-feed-smoke]') && '1' || '0' }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: node tests/android.ts
      - if: contains(github.event.pull_request.body, '[public-feed-smoke]')
        uses: actions/upload-artifact@v4
        with:
          name: android-owner-preview
          path: playwright-report/owner-preview
