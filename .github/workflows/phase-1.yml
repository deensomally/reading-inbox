name: Phase 1 reader checks
on: pull_request
permissions:
  contents: read
jobs:
  reader:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            project: phone
            channel: chromium
          - os: windows-latest
            project: desktop
            channel: msedge
          - os: windows-latest
            project: desktop
            channel: chrome
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      READER_BROWSER_CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:unit
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=${{ matrix.project }} --workers=1
      - if: matrix.channel == 'chrome'
        uses: actions/upload-artifact@v4
        with:
          name: reading-box-preview
          path: dist
          include-hidden-files: true
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Allow the runner to use its emulator accelerator
        run: sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Start the production demo
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/reading-preview.log 2>&1 &
          curl --retry 15 --retry-delay 1 --retry-connrefused --fail http://127.0.0.1:4173/
      - name: Test Chrome on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: node tests/android.ts
